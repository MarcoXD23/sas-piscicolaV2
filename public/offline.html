<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f655f">
    <title>Sin conexión · El SAS Piscícola</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <style>
        :root { --marca: #0f655f; --texto: #1e293b; --suave: #475569; --fondo: #f8fafc; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        main { max-width: 26rem; text-align: center; }
        img { width: 80px; height: 80px; border-radius: 24px; }
        h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
        p { font-size: 1rem; line-height: 1.5; color: var(--suave); margin: 0 0 1.5rem; }
        button { min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 12px; background: var(--marca); color: #fff;
                 font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:focus-visible, a:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
        .principal { display: flex; align-items: center; justify-content: center; min-height: 56px; margin-bottom: 1rem; padding: 0 1.5rem;
                     border-radius: 12px; background: var(--marca); color: #fff; font-size: 1.125rem; font-weight: 700; text-decoration: none; }
        .secundario { background: #fff; color: var(--marca); box-shadow: inset 0 0 0 1px #94e9da; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" width="96" height="96" alt="">
        <h1>Sin conexión</h1>
        <p>No hay internet en este momento. Esta pantalla no está guardada en el teléfono, pero puedes registrar raciones, mortalidad, avisos de pesca, rondas y mediciones en Registro rápido: se envían solos cuando vuelva la señal.</p>
        <a class="principal" href="/campo">Abrir Registro rápido</a>
        <button type="button" class="secundario" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
